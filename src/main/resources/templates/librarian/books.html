<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Quản lý sách')}"></head>
<body class="phenikaa-body">

<nav th:replace="~{fragments/navbar :: librarianNav('books')}"></nav>
<div th:replace="~{fragments/common :: messages}"></div>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="section-header mb-0">
            <div class="section-header-icon"><i class="bi bi-book-half"></i></div>
            <div>
                <h1 class="section-title">Quản lý sách</h1>
                <p class="section-subtitle"
               th:text="${(keyword != null or selectedDocType != null or availableOnly)
                          ? books.size() + ' kết quả tìm được'
                          : books.size() + ' tài liệu trong hệ thống'}"></p>
            </div>
        </div>
        <div class="btn-group"
             th:if="${@permissionService.has(currentUser.role, T(com.library.entity.Permission).BOOK_CREATE)}">
            <a th:href="@{/librarian/books/new}" class="btn btn-phenikaa">
                <i class="bi bi-plus-lg me-2"></i>Thêm sách mới
            </a>
            <button type="button" class="btn btn-phenikaa dropdown-toggle dropdown-toggle-split"
                    data-bs-toggle="dropdown" aria-expanded="false">
                <span class="visually-hidden">Tuỳ chọn</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <a class="dropdown-item" th:href="@{/librarian/books/new}">
                        <i class="bi bi-file-earmark-plus me-2"></i>Thêm 1 sách
                    </a>
                </li>
                <li>
                    <a class="dropdown-item" th:href="@{/librarian/books/new-batch}">
                        <i class="bi bi-table me-2"></i>Thêm nhiều sách (danh sách)
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- THANH TÌM KIẾM & FILTER -->
    <div class="card mb-3">
        <div class="card-body py-2">
            <form th:action="@{/librarian/books}" method="get" class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label class="form-label small text-muted mb-1">Tìm theo tên / tác giả / ISBN</label>
                    <input type="text" name="keyword" class="form-control form-control-sm"
                           th:value="${keyword}" placeholder="Nhập từ khoá...">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1">Loại tài liệu</label>
                    <select name="docType" class="form-select form-select-sm">
                        <option value="">-- Tất cả loại --</option>
                        <option value="TEXTBOOK"       th:selected="${selectedDocType != null and selectedDocType.name() == 'TEXTBOOK'}">Giáo trình</option>
                        <option value="SPECIALIZED_REF" th:selected="${selectedDocType != null and selectedDocType.name() == 'SPECIALIZED_REF'}">TK Chuyên ngành</option>
                        <option value="GENERAL_REF"    th:selected="${selectedDocType != null and selectedDocType.name() == 'GENERAL_REF'}">TK Tra cứu</option>
                        <option value="RESTRICTED"     th:selected="${selectedDocType != null and selectedDocType.name() == 'RESTRICTED'}">Tài liệu nội sinh</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <div class="form-check mb-1">
                        <input class="form-check-input" type="checkbox" name="availableOnly" id="availableOnly"
                               value="true" th:checked="${availableOnly}">
                        <label class="form-check-label small" for="availableOnly">Còn sẵn</label>
                    </div>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-phenikaa btn-sm flex-fill">
                        <i class="bi bi-search me-1"></i>Tìm
                    </button>
                    <a th:href="@{/librarian/books}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card table-card">
        <table class="table table-hover mb-0">
            <thead>
                <tr><th>Tên sách</th><th>Tác giả</th><th>Loại TL</th><th>Mã phân loại</th>
                    <th class="text-center">Tổng</th><th class="text-center">Còn</th><th>Hành động</th></tr>
            </thead>
            <tbody>
                <tr th:if="${books.isEmpty()}">
                    <td colspan="7" class="text-center text-muted py-4">
                        <i class="bi bi-search me-1"></i>Không tìm thấy tài liệu nào phù hợp.
                    </td>
                </tr>
                <tr th:each="book : ${books}">
                    <td>
                        <div class="fw-semibold" th:text="${book.title}"></div>
                        <small class="text-muted" th:text="${book.isbn}" th:if="${book.isbn != null}"></small>
                    </td>
                    <td class="small" th:text="${book.author}"></td>
                    <td>
                        <span th:switch="${book.docType.name()}">
                            <span th:case="'TEXTBOOK'" class="doc-type-badge badge-textbook">Giáo trình</span>
                            <span th:case="'SPECIALIZED_REF'" class="doc-type-badge badge-specialized">TK CN</span>
                            <span th:case="'GENERAL_REF'" class="doc-type-badge badge-general">TK TC</span>
                            <span th:case="'RESTRICTED'" class="doc-type-badge badge-restricted">Nội sinh</span>
                        </span>
                    </td>
                    <td><code class="small" th:text="${book.classificationCode}"></code></td>
                    <td class="text-center" th:text="${book.totalCopies}"></td>
                    <td class="text-center">
                        <span class="fw-bold text-success" th:text="${book.availableCopies}" th:if="${book.availableCopies > 0}"></span>
                        <span class="fw-bold text-danger" th:text="0" th:if="${book.availableCopies == 0}"></span>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{/librarian/books/{id}/edit(id=${book.id})}" class="btn btn-outline-primary btn-sm"
                               th:if="${@permissionService.has(currentUser.role, T(com.library.entity.Permission).BOOK_UPDATE)}"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/librarian/books/{id}/delete(id=${book.id})}" method="post" class="d-inline"
                                  th:if="${@permissionService.has(currentUser.role, T(com.library.entity.Permission).BOOK_DELETE)}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Xóa sách này?')"><i class="bi bi-trash3"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Quản lý sách')}"></head>
<body class="phenikaa-body">

<nav th:replace="~{fragments/navbar :: librarianNav('books')}"></nav>
<div th:replace="~{fragments/common :: messages}"></div>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="section-header mb-0">
            <div class="section-header-icon"><i class="bi bi-book-half"></i></div>
            <div>
                <h1 class="section-title">Quản lý sách</h1>
                <p class="section-subtitle" th:text="${books.size()} + ' tài liệu trong hệ thống'"></p>
            </div>
        </div>
        <a th:href="@{/librarian/books/new}" class="btn btn-phenikaa"
           th:if="${@permissionService.has(currentUser.role, T(com.library.entity.Permission).BOOK_CREATE)}">
            <i class="bi bi-plus-lg me-2"></i>Thêm sách mới</a>
    </div>

    <div class="card table-card">
        <table class="table table-hover mb-0">
            <thead>
                <tr><th>Tên sách</th><th>Tác giả</th><th>Loại TL</th><th>Mã phân loại</th>
                    <th class="text-center">Tổng</th><th class="text-center">Còn</th><th>Hành động</th></tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td>
                        <div class="fw-semibold" th:text="${book.title}"></div>
                        <small class="text-muted" th:text="${book.isbn}" th:if="${book.isbn != null}"></small>
                    </td>
                    <td class="small" th:text="${book.author}"></td>
                    <td>
                        <span th:switch="${book.docType.name()}">
                            <span th:case="'TEXTBOOK'" class="doc-type-badge badge-textbook">Giáo trình</span>
                            <span th:case="'SPECIALIZED_REF'" class="doc-type-badge badge-specialized">TK CN</span>
                            <span th:case="'GENERAL_REF'" class="doc-type-badge badge-general">TK TC</span>
                            <span th:case="'RESTRICTED'" class="doc-type-badge badge-restricted">Nội sinh</span>
                        </span>
                    </td>
                    <td><code class="small" th:text="${book.classificationCode}"></code></td>
                    <td class="text-center" th:text="${book.totalCopies}"></td>
                    <td class="text-center">
                        <span class="fw-bold text-success" th:text="${book.availableCopies}" th:if="${book.availableCopies > 0}"></span>
                        <span class="fw-bold text-danger" th:text="0" th:if="${book.availableCopies == 0}"></span>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{/librarian/books/{id}/edit(id=${book.id})}" class="btn btn-outline-primary btn-sm"
                               th:if="${@permissionService.has(currentUser.role, T(com.library.entity.Permission).BOOK_UPDATE)}"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/librarian/books/{id}/delete(id=${book.id})}" method="post" class="d-inline"
                                  th:if="${@permissionService.has(currentUser.role, T(com.library.entity.Permission).BOOK_DELETE)}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Xóa sách này?')"><i class="bi bi-trash3"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>

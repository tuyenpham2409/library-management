<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${book.title})}"></head>
<body class="phenikaa-body">

<nav th:replace="~{fragments/navbar :: clientNav('home')}"></nav>
<div th:replace="~{fragments/common :: messages}"></div>

<main class="container py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/client/home}">Tìm kiếm</a></li>
            <li class="breadcrumb-item active" th:text="${book.title}"></li>
        </ol>
    </nav>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card text-center p-4">
                <div class="book-card-img-container rounded mb-3" style="height:250px">
                    <img th:if="${book.imageUrl != null and !book.imageUrl.isEmpty()}" th:src="${book.imageUrl}" th:alt="${book.title}" style="max-height:100%;object-fit:contain">
                    <div class="book-img-placeholder" th:if="${book.imageUrl == null or book.imageUrl.isEmpty()}" style="font-size:5rem">
                        <span th:switch="${book.docType.name()}">
                            <span th:case="'TEXTBOOK'">📚</span>
                            <span th:case="'SPECIALIZED_REF'">🔬</span>
                            <span th:case="'GENERAL_REF'">📖</span>
                            <span th:case="'RESTRICTED'">🔒</span>
                        </span>
                    </div>
                </div>
                <div class="mb-3">
                    <span class="badge bg-success fs-6 px-3 py-2" th:if="${book.availableCopies > 0}">
                        <i class="bi bi-check-circle me-1"></i>Còn <span th:text="${book.availableCopies}"></span> cuốn
                    </span>
                    <span class="badge bg-secondary fs-6 px-3 py-2" th:if="${book.availableCopies == 0}">
                        <i class="bi bi-x-circle me-1"></i>Hết sách
                    </span>
                </div>
                <div th:if="${book.docType.name() != 'RESTRICTED'}">
                    <div class="alert alert-warning small py-2" th:if="${inCart}"><i class="bi bi-cart-check me-1"></i>Đã có trong giỏ</div>
                    <div class="alert alert-secondary small py-2" th:if="${!inCart and !canBorrow}">Tài khoản chưa được cấp quyền mượn.</div>
                    <form th:if="${!inCart and book.availableCopies > 0 and !hasOverdue and canBorrow}"
                          th:action="@{/client/cart/add}" method="post" class="add-cart-form" data-mark-added="true">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <button type="submit" class="btn btn-phenikaa w-100"><i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ</button>
                    </form>
                </div>
                <div th:if="${book.docType.name() == 'RESTRICTED'}" class="alert alert-danger small">
                    <i class="bi bi-lock-fill me-1"></i>Tài liệu này chỉ đọc tại thư viện.
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-4">
                <div class="mb-3">
                    <span th:switch="${book.docType.name()}">
                        <span th:case="'TEXTBOOK'" class="doc-type-badge badge-textbook">Giáo trình</span>
                        <span th:case="'SPECIALIZED_REF'" class="doc-type-badge badge-specialized">TK Chuyên ngành</span>
                        <span th:case="'GENERAL_REF'" class="doc-type-badge badge-general">TK Tra cứu</span>
                        <span th:case="'RESTRICTED'" class="doc-type-badge badge-restricted">Nội sinh 🔒</span>
                    </span>
                </div>
                <h1 class="h3 fw-bold text-dark" th:text="${book.title}"></h1>
                <p class="text-muted fs-5 mb-3" th:text="${book.author}"></p>

                <table class="table table-borderless small">
                    <tr th:if="${book.isbn != null}"><th class="text-muted" style="width:35%">ISBN</th><td th:text="${book.isbn}"></td></tr>
                    <tr th:if="${book.classificationCode != null}"><th class="text-muted">Mã phân loại</th><td><code th:text="${book.classificationCode}"></code></td></tr>
                    <tr th:if="${book.category != null}"><th class="text-muted">Danh mục</th><td th:text="${book.category}"></td></tr>
                    <tr th:if="${book.publisher != null}"><th class="text-muted">Nhà xuất bản</th><td th:text="${book.publisher}"></td></tr>
                    <tr th:if="${book.publishYear != null}"><th class="text-muted">Năm xuất bản</th><td th:text="${book.publishYear}"></td></tr>
                    <tr><th class="text-muted">Tổng số cuốn</th><td th:text="${book.totalCopies}"></td></tr>
                    <tr><th class="text-muted">Còn có sẵn</th>
                        <td>
                            <span class="fw-bold text-success" th:text="${book.availableCopies}" th:if="${book.availableCopies > 0}"></span>
                            <span class="fw-bold text-danger" th:text="'0'" th:if="${book.availableCopies == 0}"></span>
                        </td>
                    </tr>
                </table>

                <div th:if="${book.description != null and !book.description.isEmpty()}" class="mt-3">
                    <h6 class="fw-bold text-muted">Mô tả:</h6>
                    <p class="text-dark" th:text="${book.description}"></p>
                </div>

                <div class="mt-4">
                    <a th:href="@{/client/home}" class="btn btn-outline-secondary me-2"
                       onclick="if(history.length>1){history.back();return false;}">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại
                    </a>
                    <a th:href="@{/client/cart}" class="btn btn-gold">
                        <i class="bi bi-cart3 me-1"></i>Xem giỏ
                        (<span class="js-cart-count" th:text="${cartCount != null ? cartCount : 0}">0</span>)
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
<th:block th:replace="~{fragments/common :: cartScript}"></th:block>
</body>
</html>

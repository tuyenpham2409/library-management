<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Quản lý người dùng')}"></head>
<body class="phenikaa-body">

<nav th:replace="~{fragments/navbar :: adminNav('users')}"></nav>
<div th:replace="~{fragments/common :: messages}"></div>

<main class="container py-4">
    <div class="section-header mb-4">
        <div class="section-header-icon"><i class="bi bi-people-fill"></i></div>
        <div>
            <h1 class="section-title">Quản lý người dùng</h1>
            <p class="section-subtitle" th:text="${users.size()} + ' tài khoản'"></p>
        </div>
    </div>

    <!-- TẠO TÀI KHOẢN -->
    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h6 fw-bold mb-3"><i class="bi bi-person-plus me-2"></i>Tạo tài khoản mới</h2>
            <form th:action="@{/admin/users}" method="post" class="row g-2 align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-3"><label class="form-label small text-muted">Mã số</label><input type="text" name="studentCode" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label small text-muted">Họ tên</label><input type="text" name="fullName" class="form-control" required></div>
                <div class="col-md-2"><label class="form-label small text-muted">Vai trò</label>
                    <select name="role" class="form-select" required>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <div class="col-md-2"><label class="form-label small text-muted">Mật khẩu</label><input type="text" name="password" class="form-control" required></div>
                <div class="col-md-2"><button type="submit" class="btn btn-phenikaa w-100"><i class="bi bi-plus-lg me-1"></i>Tạo</button></div>
            </form>
        </div>
    </div>

    <div class="card table-card">
        <!-- Tìm kiếm / lọc lồng ngay trong bảng người dùng -->
        <div class="card-header bg-white">
            <form th:action="@{/admin/users}" method="get" class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label small text-muted mb-1">Tìm theo mã số / họ tên</label>
                    <input type="text" name="keyword" class="form-control form-control-sm" th:value="${keyword}" placeholder="Nhập từ khoá...">
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted mb-1">Lọc theo vai trò</label>
                    <select name="role" class="form-select form-select-sm">
                        <option value="">-- Tất cả vai trò --</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                th:selected="${selectedRole != null and selectedRole == r}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-phenikaa btn-sm flex-fill"><i class="bi bi-search me-1"></i>Tìm</button>
                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>
                </div>
            </form>
        </div>
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr><th>Mã số</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái thẻ</th><th>Ngày tạo</th><th>Hành động</th></tr>
            </thead>
            <tbody>
                <th:block th:each="u : ${users}">
                <tr th:classappend="${u.cardStatus.name() == 'LOCKED'} ? 'table-secondary' : ''">
                    <td><code th:text="${u.studentCode}"></code></td>
                    <td class="fw-semibold" th:text="${u.fullName}"></td>
                    <td>
                        <span th:switch="${u.role.name()}">
                            <span th:case="'STUDENT'" class="badge bg-info text-dark">Sinh viên</span>
                            <span th:case="'LECTURER'" class="badge bg-primary">Giảng viên</span>
                            <span th:case="'RESEARCHER'" class="badge" style="background:#7c3aed">Nghiên cứu viên</span>
                            <span th:case="'LIBRARIAN'" class="badge bg-secondary">Thủ thư</span>
                            <span th:case="'ADMIN'" class="badge bg-dark">Admin</span>
                        </span>
                    </td>
                    <td>
                        <span class="badge bg-success" th:if="${u.cardStatus.name() == 'ACTIVE'}"><i class="bi bi-check-circle me-1"></i>Hoạt động</span>
                        <span class="badge bg-danger" th:if="${u.cardStatus.name() == 'LOCKED'}"><i class="bi bi-lock-fill me-1"></i>Đang khoá</span>
                    </td>
                    <td class="small text-muted" th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd/MM/yyyy') : '--'}"></td>
                    <td>
                        <div class="d-flex gap-1 flex-wrap">
                            <button class="btn btn-outline-primary btn-sm" type="button"
                                    data-bs-toggle="collapse" th:data-bs-target="'#edit' + ${u.id}"><i class="bi bi-pencil"></i></button>
                            <form th:if="${u.role.name() != 'ADMIN'}" th:action="@{/admin/users/{id}/toggle-status(id=${u.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${u.cardStatus.name() == 'ACTIVE'} ? 'btn-outline-warning' : 'btn-outline-success'"
                                        th:title="${u.cardStatus.name() == 'ACTIVE'} ? 'Khoá thẻ' : 'Mở khoá'"
                                        onclick="return confirm('Đổi trạng thái thẻ tài khoản này?')">
                                    <i th:class="${u.cardStatus.name() == 'ACTIVE'} ? 'bi bi-lock' : 'bi bi-unlock'"></i>
                                </button>
                            </form>
                            <form th:if="${u.role.name() != 'ADMIN'}" th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Xoá"
                                        onclick="return confirm('Xoá tài khoản này? (chỉ xoá được khi chưa có lịch sử mượn)')"><i class="bi bi-trash3"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <!-- Hàng sửa (ẩn) -->
                <tr class="collapse" th:id="'edit' + ${u.id}">
                    <td colspan="6" class="bg-light">
                        <div class="row g-3 py-2">
                            <div class="col-md-6">
                                <form th:action="@{/admin/users/{id}/update(id=${u.id})}" method="post" class="row g-2 align-items-end">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <div class="col-6"><label class="form-label small text-muted">Họ tên</label>
                                        <input type="text" name="fullName" class="form-control form-control-sm" th:value="${u.fullName}" required></div>
                                    <div class="col-4"><label class="form-label small text-muted">Vai trò</label>
                                        <select name="role" class="form-select form-select-sm">
                                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${u.role == r}"></option>
                                        </select>
                                    </div>
                                    <div class="col-2"><button type="submit" class="btn btn-primary btn-sm w-100">Lưu</button></div>
                                </form>
                            </div>
                            <div class="col-md-6">
                                <form th:action="@{/admin/users/{id}/reset-password(id=${u.id})}" method="post" class="row g-2 align-items-end"
                                      onsubmit="return confirm('Đặt lại mật khẩu cho tài khoản này?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <div class="col-8"><label class="form-label small text-muted">Mật khẩu mới (≥ 6 ký tự)</label>
                                        <input type="text" name="password" class="form-control form-control-sm" required minlength="6"></div>
                                    <div class="col-4"><button type="submit" class="btn btn-outline-secondary btn-sm w-100"><i class="bi bi-key me-1"></i>Đặt lại</button></div>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                </th:block>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
